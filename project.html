<!DOCTYPE html>
<html>

<head>

    <title>Vishnu Website</title>

    <style>

       
        * {
            box-sizing: border-box;
        }

       
        body {
            margin: 0;
            font-family: Arial;
        }

        
        .navbar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            background-color: black;
        }

        
        .navbar a {
            color: white;
            text-decoration: none;
        }

        .navbar a:hover {
            color: yellow;
        }

        
        .courses {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        
        .course {
            padding: 20px;
            border: 2px solid black;
            margin: 5px;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>

    </nav>

    <div class="courses">

        <div class="course">
            <h2>Java</h2>
            <p>Learn Java Programming</p>
        </div>

        <div class="course">
            <h2>HTML</h2>
            <p>Learn HTML</p>
        </div>

        <div class="course">
            <h2>CSS</h2>
            <p>Learn CSS</p>
        </div>

    </div>

</body>

</html>
